<!doctype html>
<html lang="es" data-tema="miel" data-modo="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f4" />
    <title>Beely · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Beely" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Aplica el tema guardado antes de pintar (evita el destello claro en modo oscuro).
      // Misma llave y valores que src/stores/useTemaStore.ts.
      try {
        var t = JSON.parse(localStorage.getItem('beely-panel-tema') || '{}')
        var r = document.documentElement
        if (t.tema) r.dataset.tema = t.tema
        r.dataset.modo = t.modo || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
